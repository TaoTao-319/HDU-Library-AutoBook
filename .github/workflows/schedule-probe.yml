name: Temporary schedule diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/schedule-probe.yml']
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  timestamp:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record trigger without logging in or booking
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone, timedelta
          import os
          print('event=' + os.environ['TRIGGER_EVENT'])
          print('cron=' + os.environ.get('CRON_EXPRESSION', ''))
          print('utc=' + datetime.now(timezone.utc).isoformat())
          print('beijing=' + datetime.now(timezone(timedelta(hours=8))).isoformat())
          print('diagnostic_only=True; no credentials loaded; no reservation requests')
          PY
      - name: Disable probe after its first actual schedule event
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.request import Request, urlopen
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/workflows/schedule-probe.yml/disable'
          request = Request(url, data=b'', method='PUT', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          with urlopen(request, timeout=20) as response:
              assert response.status == 204
          print('Native schedule observed; temporary probe disabled.')
          PY
