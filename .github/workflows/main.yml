name: HDU Auto Book

on:
  workflow_dispatch:
  schedule:
    # UTC -> 北京时间 21:15 / 21:20。GitHub cron 可能排队延迟。
    - cron: '15,20 13 * * *'

concurrency:
  group: hdu-seat-booking
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Auto Book
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py
