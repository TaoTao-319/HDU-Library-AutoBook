name: HDU Auto Book

on:
  workflow_dispatch:
  # Automatic booking currently runs locally only, capped at five daily rounds.
  # Keep the manual cloud entry without adding a second automatic scheduler.

concurrency:
  group: hdu-seat-booking
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Auto Book
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py
