name: HDU Auto Book

on:
  workflow_dispatch:
  schedule:
    # UTC 11:50 = Beijing 19:50. Prepare before the 20:00 release.
    - cron: '50 11 * * *'

permissions:
  contents: read

concurrency:
  group: hdu-seat-booking
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scheduled daily booking
        if: github.event_name == 'schedule'
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py --daily
      - name: Manual daily booking
        if: github.event_name == 'workflow_dispatch'
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py --daily
      - name: Save booking diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-booking-${{ github.run_id }}
          path: |
            logs/*.log
            .local/booking-*.json
            .local/daily-state-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
