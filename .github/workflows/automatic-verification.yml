name: Temporary native-schedule booking verification

on:
  schedule:
    # Temporary test on 2026-10-20 only: Beijing 09:59 and 10:05.
    - cron: '59 1 * * *'
    - cron: '5 2 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: hdu-seat-booking
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Enforce automatic event and bounded test window
        id: window
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          from datetime import datetime
          import os
          cutoff = datetime.fromisoformat('2026-10-20T11:15:00+08:00')
          start = datetime.fromisoformat('2026-10-20T09:50:00+08:00')
          now = datetime.now(cutoff.tzinfo)
          active = os.environ['TRIGGER_EVENT'] == 'schedule' and start <= now <= cutoff
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('active=' + str(active).lower() + '\n')
          print('event=' + os.environ['TRIGGER_EVENT'])
          print('beijing=' + now.isoformat())
          print('automatic_booking_test_active=' + str(active).lower())
          PY
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        if: steps.window.outputs.active == 'true'
        run: python -m pip install -r requirements.txt
      - name: Automatic booking and server-side order verification
        id: booking
        if: steps.window.outputs.active == 'true'
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py
      - name: Disable temporary verification after success or expiry
        if: always() && (steps.window.outputs.active == 'false' || steps.booking.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.request import Request, urlopen
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/workflows/automatic-verification.yml/disable'
          request = Request(url, data=b'', method='PUT', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          with urlopen(request, timeout=20) as response:
              assert response.status == 204
          print('Temporary verification disabled; daily production schedule is unchanged.')
          PY
