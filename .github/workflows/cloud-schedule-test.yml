name: Cloud native schedule booking test

on:
  schedule:
    # Native cron only. One claimed run, bounded by the guard below.
    - cron: '3-58/5 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: hdu-seat-booking
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'schedule' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - name: Disable further test triggers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/cloud-schedule-test.yml/disable"
      - name: Claim the single native test and enforce expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/native_schedule_guard.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reserve Thursday 07:00-08:00 on the fourth floor
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py --test-booking --date 2026-10-22 --start 7 --hours 1 --region 自定义
      - name: Accept only a new order from this native schedule run
        run: python scripts/verify_native_booking.py --date 2026-10-22 --start 7 --hours 1
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-schedule-test-${{ github.run_id }}
          path: |
            logs/*.log
            .local/booking-*.json
            .local/pending-*.json
            .local/verified-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
