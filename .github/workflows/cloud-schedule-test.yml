name: Cloud native schedule booking test

on:
  schedule:
    # Temporary polling for one native event; the first run disables this workflow.
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: hdu-seat-booking
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Disable further test triggers and check test date
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/cloud-schedule-test.yml/disable"
          if [ "$(TZ=Asia/Shanghai date +%F)" = '2026-10-21' ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'Test expired: no login or booking was attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.eligible == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.eligible == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        if: steps.guard.outputs.eligible == 'true'
        run: python -m pip install -r requirements.txt
      - name: Reserve Thursday 07:00-08:00 on the fourth floor
        if: steps.guard.outputs.eligible == 'true'
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python main.py --test-booking --date 2026-10-22 --start 7 --hours 1 --region 自定义
          python scripts/verify_native_booking.py
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          start = int(datetime(2026, 10, 22, 7, tzinfo=timezone(timedelta(hours=8))).timestamp())
          reports = [order for path in Path('.local').glob('booking-*.json')
                     for order in json.loads(path.read_text(encoding='utf-8'))]
          assert any(int(datetime.fromisoformat(order['begin']).timestamp()) == start and int(order['duration']) == 3600
                     and order.get('submission_confirmed') is True
                     and order.get('already_existed') is False for order in reports), 'Wrong test time or no new order'
          PY
      - name: Save test diagnostics
        if: always() && steps.guard.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-schedule-test-${{ github.run_id }}
          path: |
            logs/*.log
            .local/booking-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
