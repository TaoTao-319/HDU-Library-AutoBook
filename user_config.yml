# 预约后天四楼 35–58 号座位中的一个，预约日期为周一至周五时启用，周六、周日关闭。
# 周一15–22、周二16–22、周三7–8、周四15–22、周五13–22；name 均为自定义。
# 一天可约多个互不重合的时段：把那天的 开始时间/持续小时数 两行换成「时间段」列表（缩进与 name 对齐），例如：
#   时间段:
#     - 开始时间: 7
#       持续小时数: 2
#     - 开始时间: 10
#       持续小时数: 3
#     - 开始时间: 18
#       持续小时数: 2
# 时段之间不能重合（首尾相接可以）；配了 时间段 就不要再保留 开始时间/持续小时数。
# 下面座位 ID 区间均含端点；不连续的区间分行写。指定座位只需改本文件。

周一:
  启用: true
  name: 自定义
  开始时间: 15
  持续小时数: 7
周二:
  启用: true
  name: 自定义
  开始时间: 16
  持续小时数: 6
周三:
  启用: true
  name: 自定义
  开始时间: 7
  持续小时数: 1
周四:
  启用: true
  name: 自定义
  开始时间: 15
  持续小时数: 7
周五:
  启用: true
  name: 自定义
  开始时间: 13
  持续小时数: 9
周六:
  启用: false
  name: 自定义
  开始时间: 7
  持续小时数: 15
周日:
  启用: false
  name: 自定义
  开始时间: 7
  持续小时数: 15


